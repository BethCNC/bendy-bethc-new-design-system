<!-- Site Header Component - Production Version -->
<!-- Uses existing design system tokens only -->
<style>
    /* Site Header - Using Existing Design System Tokens */
    .site-header {
        position: relative;
        width: 100%;
        max-width: 1468px;
        margin: 0 auto 2rem auto;
        background: var(--surface-neutral-card);
        border: 2px solid var(--border-neutral-default, #252626);
        border-radius: 0;
        padding: var(--spacing-lg) var(--spacing-2xl);
        transition: all 0.3s ease;
        overflow: hidden;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
        box-sizing: border-box;
    }
    
    .site-header-logo-container {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }
    
    .site-header-logo {
        max-width: 622px;
        width: auto;
        height: auto;
        max-height: 100px;
        object-fit: contain;
        transition: all 0.3s ease;
    }
    
    .site-header-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 1;
    }
    
    .site-header:hover {
        background: var(--surface-neutral-inverse);
        border-width: 4px;
        min-height: 220px;
    }
    
    .site-header:hover .site-header-video {
        opacity: 0.8;
    }
    
    .site-header:hover .site-header-logo-container {
        transform: scale(1.02);
    }
    
    @media (max-width: 810px) {
        .site-header {
            padding: var(--spacing-lg-tablet) var(--spacing-xl-tablet);
            min-height: 160px;
        }
        
        .site-header-logo {
            max-width: 450px;
            max-height: 80px;
        }
    }
    
    @media (max-width: 390px) {
        .site-header {
            padding: var(--spacing-lg-mobile) var(--spacing-xl-mobile);
            min-height: 120px;
        }
        
        .site-header-logo {
            max-width: 280px;
            max-height: 60px;
        }
    }
</style>

<header class="site-header">
    <!-- Background video for hover effect -->
    <video 
        class="site-header-video" 
        autoplay 
        muted 
        loop 
        preload="metadata"
    >
        <source src="../../public/videos/clouds.mp4" type="video/mp4">
        <source src="../../public/videos/clouds_halfsize.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <!-- Logo container -->
    <div class="site-header-logo-container">
        <img 
            src="../assets/40898351e1251025097936fe3fe63bdb492d3ff6.svg" 
            alt="Bendy BethC - Creative Design & Development" 
            class="site-header-logo"
        >
    </div>
</header>

<script>
    // Site header video control
    document.addEventListener('DOMContentLoaded', function() {
        const siteHeaders = document.querySelectorAll('.site-header');
        
        siteHeaders.forEach(header => {
            const video = header.querySelector('.site-header-video');
            
            if (video) {
                video.load();
                
                header.addEventListener('mouseenter', () => {
                    if (video.paused) {
                        video.play().catch(e => console.log('Video autoplay blocked:', e));
                    }
                });
            }
        });
    });
</script>
